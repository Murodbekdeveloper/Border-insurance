services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-osago}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-osago}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me}
      JWT_ACCESS_EXPIRES_IN_SECONDS: ${JWT_ACCESS_EXPIRES_IN_SECONDS:-900}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_too}
      JWT_REFRESH_EXPIRES_IN_SECONDS: ${JWT_REFRESH_EXPIRES_IN_SECONDS:-604800}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:4000/auth/google/callback}
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PAYMENT_GATEWAY_PROVIDER: ${PAYMENT_GATEWAY_PROVIDER:-mock}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
      PAYME_KEY: ${PAYME_KEY:-}
      PAYME_ENDPOINT: ${PAYME_ENDPOINT:-https://checkout.test.paycom.uz/api}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-OSAGO Online <no-reply@osago.local>}
      ESKIZ_EMAIL: ${ESKIZ_EMAIL:-}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD:-}
      ESKIZ_BASE_URL: ${ESKIZ_BASE_URL:-https://notify.eskiz.uz/api}
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY:-}
      INSURANCE_PARTNER_API_URL: ${INSURANCE_PARTNER_API_URL:-}
      INSURANCE_PARTNER_API_KEY: ${INSURANCE_PARTNER_API_KEY:-}
      INSURANCE_PARTNER_INBOUND_TOKEN: ${INSURANCE_PARTNER_INBOUND_TOKEN:-change_me}
      INSURANCE_PARTNER_CALLBACK_TOKEN: ${INSURANCE_PARTNER_CALLBACK_TOKEN:-change_me}
      ADMIN_JWT_ACCESS_SECRET: ${ADMIN_JWT_ACCESS_SECRET:-change_me}
      ADMIN_JWT_ACCESS_EXPIRES_IN_SECONDS: ${ADMIN_JWT_ACCESS_EXPIRES_IN_SECONDS:-900}
      ADMIN_JWT_REFRESH_SECRET: ${ADMIN_JWT_REFRESH_SECRET:-change_me_too}
      ADMIN_JWT_REFRESH_EXPIRES_IN_SECONDS: ${ADMIN_JWT_REFRESH_EXPIRES_IN_SECONDS:-604800}
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/health']
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '3000:3000'

volumes:
  postgres_data:
