# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Backend + Postgres run on Render; the frontend runs on Vercel (see
# vercel.json / the Vercel project "border-insurance-frontend") — Vercel's
# native Next.js build pipeline doesn't work with a Dockerfile/standalone
# output, so it isn't part of this Blueprint.
#
# This file documents the actual deployed configuration (created directly
# via the Render API rather than by applying this Blueprint through the
# dashboard). If you ever re-apply it as a Blueprint, note:
#   1. Region/plan reflect what's actually running: `basic_1gb` Postgres
#      ($19/mo), `standard` backend web service ($25/mo), region frankfurt.
#   2. Any envVar below marked `sync: false` has no value here on purpose —
#      Render will prompt for it in the dashboard (real secrets never belong
#      in a file committed to git).
#   3. FRONTEND_URL / GOOGLE_CALLBACK_URL point at the production domains
#      (borderinsurance.uz on Vercel, api.borderinsurance.uz on Render).
#      DNS for api.borderinsurance.uz is a CNAME to osago-backend.onrender.com,
#      managed in Cloudflare (DNS only, not proxied, so Render can issue the
#      SSL cert).

databases:
  - name: osago-db
    databaseName: osago
    user: osago
    plan: basic_1gb
    region: frankfurt

services:
  - type: web
    name: osago-backend
    runtime: docker
    repo: https://github.com/Murodbekdeveloper/Border-insurance
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard
    region: frankfurt
    healthCheckPath: /health
    domains:
      - api.borderinsurance.uz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000

      # Internal connection to the database above — no TLS needed between
      # two Render services in the same region, so DB_SSL stays false.
      # Flip to true only if DB_HOST ever points at the database's
      # *external* hostname instead.
      - key: DB_HOST
        fromDatabase:
          name: osago-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: osago-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: osago-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: osago-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: osago-db
          property: database
      - key: DB_SSL
        value: 'false'

      # Render generates and stores a real random value for each of these
      # once at first deploy — never the `dev_*` fallback configuration.ts
      # uses locally, so main.ts's production boot guard passes.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_JWT_ACCESS_SECRET
        generateValue: true
      - key: ADMIN_JWT_REFRESH_SECRET
        generateValue: true
      - key: INSURANCE_PARTNER_INBOUND_TOKEN
        generateValue: true
      - key: INSURANCE_PARTNER_CALLBACK_TOKEN
        generateValue: true

      - key: FRONTEND_URL
        value: https://borderinsurance.uz

      # OAuth / Sign in with Apple
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://api.borderinsurance.uz/auth/google/callback
      - key: GOOGLE_IOS_CLIENT_ID
        sync: false
      - key: APPLE_BUNDLE_ID
        value: com.border.app

      # Payment gateway — out of scope for this pass, stays on the mock
      # provider until real Payme merchant credentials are supplied.
      - key: PAYMENT_GATEWAY_PROVIDER
        value: mock
      - key: PAYME_MERCHANT_ID
        sync: false
      - key: PAYME_KEY
        sync: false

      # Email / SMS — falls back to logging instead of sending until set.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: 'OSAGO Online <no-reply@osago.local>'

      # Document OCR/extraction (Gemini) — stays disabled (manual-entry
      # only) until set.
      - key: GEMINI_API_KEY
        sync: false

      # Asia Insurance (real OSAGO issuer) — outbound calls fail until set.
      # CORRECTED 2026-09-11: the bare domain 301s to Asia Insurance's own
      # login page instead of reaching the API — every outbound call was
      # 404ing at the Tomcat layer with the old value here. Must include
      # the /apex/ins/osago_v3 prefix (see configuration.ts's own comment
      # on insurancePartner.apiUrl for the same fix, applied here too since
      # this env var overrides that default).
      - key: INSURANCE_PARTNER_API_URL
        value: https://ais.asia-insurance.uz/apex/ins/osago_v3
      - key: INSURANCE_PARTNER_LOGIN
        sync: false
      - key: INSURANCE_PARTNER_PASSWORD
        sync: false

      # Error monitoring — no-op until a DSN is set.
      - key: SENTRY_DSN
        sync: false
