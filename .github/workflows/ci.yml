name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: osago_admin
          POSTGRES_DB: osago_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U osago_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - name: Unit tests
        run: npm test -- --ci

      - name: Run migrations against test DB
        run: npm run migration:run
        env:
          DB_HOST: localhost
          DB_PORT: 5544
          DB_USERNAME: osago_admin
          DB_PASSWORD: ''
          DB_NAME: osago_test

      - name: E2E tests
        # backend/.env.test is gitignored (never committed, real developer
        # machines have their own local copy) — dotenv.config() in
        # test/setup-env.ts silently no-ops when it's missing, so CI must
        # supply every value it would otherwise read from that file itself.
        run: npm run test:e2e
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5544
          DB_USERNAME: osago_admin
          DB_PASSWORD: ''
          DB_NAME: osago_test
          JWT_ACCESS_SECRET: test_access_secret
          JWT_ACCESS_EXPIRES_IN_SECONDS: 900
          JWT_REFRESH_SECRET: test_refresh_secret
          JWT_REFRESH_EXPIRES_IN_SECONDS: 604800
          FRONTEND_URL: http://localhost:3000
          PAYMENT_GATEWAY_PROVIDER: mock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
